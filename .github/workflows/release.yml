name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Build optimized binary
        run: cargo build --release --locked
      - name: Package binary and installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE="forgecheck-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${PACKAGE}"
          install -m 0755 target/release/forgecheck "${PACKAGE}/forgecheck"
          install -m 0755 install.sh "${PACKAGE}/install.sh"
          install -m 0755 uninstall.sh "${PACKAGE}/uninstall.sh"
          install -m 0644 README.md "${PACKAGE}/README.md"
          install -m 0644 README_RU.md "${PACKAGE}/README_RU.md"
          install -m 0644 LICENSE "${PACKAGE}/LICENSE"
          install -m 0644 SECURITY.md "${PACKAGE}/SECURITY.md"
          tar -czf "${PACKAGE}.tar.gz" "${PACKAGE}"
          zip -qr "${PACKAGE}.zip" "${PACKAGE}"
          sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ForgeCheck ${{ github.ref_name }} GLOBAL"
          body_path: RELEASE_NOTES.md
          files: |
            forgecheck-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            forgecheck-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            forgecheck-${{ github.ref_name }}-x86_64-unknown-linux-gnu.zip
            forgecheck-${{ github.ref_name }}-x86_64-unknown-linux-gnu.zip.sha256
